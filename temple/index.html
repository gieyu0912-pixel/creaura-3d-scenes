<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>雲上禪寺 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1838;font-family:"Noto Serif TC",serif;color:#fff}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;
      padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 18px);
      display:flex;flex-direction:column;justify-content:space-between;transition:opacity .6s}
  #ui.hide{opacity:0}#ui.hide button{pointer-events:none}
  h1{margin:0;font-weight:900;font-size:clamp(28px,6vw,52px);letter-spacing:.14em;
     text-shadow:0 0 18px rgba(255,200,110,.7),0 0 42px rgba(255,150,80,.45)}
  .sub{margin-top:4px;font-size:clamp(11px,2.6vw,14px);letter-spacing:.35em;opacity:.8}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  button{pointer-events:auto;font-family:inherit;font-size:14px;color:#fff;cursor:pointer;
     background:rgba(40,28,60,.5);border:1px solid rgba(255,230,180,.35);border-radius:999px;padding:9px 16px;
     backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  button.offer{background:linear-gradient(135deg,rgba(255,190,70,.85),rgba(220,90,40,.85));border-color:#ffe3a0;font-weight:900;box-shadow:0 0 18px rgba(255,180,80,.6)}
  button.on{background:rgba(220,150,60,.5);border-color:rgba(255,220,160,.8)}
  .hint{font-size:12px;opacity:.65;letter-spacing:.1em;margin-bottom:8px}
  #eye{position:fixed;right:calc(env(safe-area-inset-right) + 14px);top:calc(env(safe-area-inset-top) + 14px);padding:8px 12px}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="ui">
  <div><h1>雲上禪寺</h1><div class="sub" id="sub">大日如來 · 光明遍照</div></div>
  <div>
    <div class="bar" id="wish" style="margin-bottom:8px">
      <button data-d="buddha" class="on">🪷 禮佛</button><button data-d="wealth">💰 求財</button><button data-d="love">💞 求姻緣</button><button data-d="fame">📜 求功名</button>
      <button id="bOffer" class="offer" style="display:none"></button>
    </div>
    <div class="hint">拖曳旋轉 · 雙指縮放 · 點兩下敲鐘 · 選擇求願後按金色按鈕供奉</div>
    <div class="bar">
      <button id="bAuto" class="on">自動環繞</button>
      <button id="bBell">🔔 敲鐘</button>
      <button id="bLamp">🪷 點蓮燈</button>
      <button id="bMode">🌙 夜晚</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const V3=THREE.Vector3,C=h=>new THREE.Color(h);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(888);const R=(a,b)=>a+(b-a)*rand();
const sm=(e0,e1,x)=>{const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t);};

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
const PR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xd9a99a,0.0026);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.5,3000);

// ---------- textures ----------
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h,c);const t=new THREE.CanvasTexture(c);t.userData={c,draw};return t;}
const dotTex=canvasTex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);});
const cloudTex=canvasTex(128,128,(g)=>{for(let i=0;i<9;i++){const x=30+rand()*68,y=46+rand()*36,r=20+rand()*26;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);}});
const smokeTex=canvasTex(64,64,(g)=>{for(let i=0;i<5;i++){const x=22+rand()*20,y=22+rand()*20;const gr=g.createRadialGradient(x,y,0,x,y,22);gr.addColorStop(0,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);}});
function tileTex(base,dark,light){const t=canvasTex(64,64,(g)=>{g.fillStyle=base;g.fillRect(0,0,64,64);
  for(let x=0;x<64;x+=8){const gr=g.createLinearGradient(x,0,x+8,0);gr.addColorStop(0,dark);gr.addColorStop(.45,light);gr.addColorStop(.6,base);gr.addColorStop(1,dark);g.fillStyle=gr;g.fillRect(x,0,8,64);}
  for(let y=0;y<64;y+=16){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,y,64,2);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,y+2,64,1);}});
  t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const latticeTex=canvasTex(256,256,(g)=>{g.fillStyle='#8e1a16';g.fillRect(0,0,256,256);
  for(let p=0;p<4;p++){const x=p*64+4;g.strokeStyle='#e8b64a';g.lineWidth=3;g.strokeRect(x,6,56,244);
    g.save();g.beginPath();g.rect(x+5,12,46,140);g.clip();g.fillStyle='#3a0d0a';g.fillRect(x+5,12,46,140);g.strokeStyle='#d9a23c';g.lineWidth=1.6;
    for(let k=-150;k<200;k+=9){g.beginPath();g.moveTo(x+5+k,12);g.lineTo(x+5+k+140,152);g.stroke();g.beginPath();g.moveTo(x+5+k+140,12);g.lineTo(x+5+k,152);g.stroke();}g.restore();
    g.strokeStyle='#e8b64a';g.lineWidth=2;g.strokeRect(x+5,12,46,140);g.strokeRect(x+9,166,38,74);
    g.fillStyle='#b8862a';g.beginPath();g.arc(x+28,203,9,0,7);g.fill();}});
const wallTex=canvasTex(128,128,(g)=>{g.fillStyle='#a8231c';g.fillRect(0,0,128,128);g.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<128;y+=8)g.fillRect(0,y,128,1);
  g.strokeStyle='#e0b050';g.lineWidth=3;g.strokeRect(14,18,100,92);g.fillStyle='#5c120e';g.fillRect(30,34,68,60);g.strokeStyle='#d9a23c';g.lineWidth=2;
  for(let x=34;x<98;x+=8){g.beginPath();g.moveTo(x,34);g.lineTo(x,94);g.stroke();}for(let y=38;y<94;y+=8){g.beginPath();g.moveTo(30,y);g.lineTo(98,y);g.stroke();}});
const bracketTex=canvasTex(256,64,(g)=>{g.fillStyle='#1d4f63';g.fillRect(0,0,256,64);
  for(let x=0;x<256;x+=32){g.fillStyle=(x/32)%2?'#2f8a7a':'#2a5fa8';g.fillRect(x+2,8,28,48);g.strokeStyle='#f0c25a';g.lineWidth=2;g.strokeRect(x+2,8,28,48);
    g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.5;g.beginPath();g.arc(x+16,32,9,0,Math.PI*1.6);g.stroke();g.beginPath();g.arc(x+16,32,4,Math.PI,Math.PI*2.4);g.stroke();}
  g.fillStyle='#f0c25a';g.fillRect(0,0,256,4);g.fillRect(0,60,256,4);});
bracketTex.wrapS=THREE.RepeatWrapping;
const pagodaTex=canvasTex(128,128,(g)=>{g.fillStyle='#efe6d6';g.fillRect(0,0,128,128);g.fillStyle='#a8231c';g.fillRect(0,0,12,128);g.fillRect(116,0,12,128);
  g.fillStyle='#5c120e';g.beginPath();g.moveTo(40,112);g.lineTo(40,52);g.quadraticCurveTo(64,22,88,52);g.lineTo(88,112);g.closePath();g.fill();
  g.strokeStyle='#d9a23c';g.lineWidth=3;g.stroke();g.fillStyle='#ffcf7a';g.globalAlpha=.55;g.fillRect(50,60,28,46);g.globalAlpha=1;});
pagodaTex.wrapS=THREE.RepeatWrapping;pagodaTex.repeat.x=8;
const pagodaEmi=canvasTex(128,128,(g)=>{g.fillStyle='#000';g.fillRect(0,0,128,128);g.fillStyle='#ffb54a';g.fillRect(50,60,28,46);});
pagodaEmi.wrapS=THREE.RepeatWrapping;pagodaEmi.repeat.x=8;
const stoneTex=canvasTex(128,128,(g)=>{g.fillStyle='#cfc8bc';g.fillRect(0,0,128,128);
  for(let y=0;y<128;y+=16)for(let x=(y/16%2)*16;x<128+32;x+=32){g.fillStyle=`rgb(${190+rand()*30|0},${184+rand()*28|0},${172+rand()*26|0})`;g.fillRect(x+1,y+1,30,14);}});
stoneTex.wrapS=stoneTex.wrapT=THREE.RepeatWrapping;
function plaqueTex(text,vertical){return canvasTex(vertical?128:512,vertical?384:144,(g,w,h)=>{
  g.fillStyle='#152553';g.fillRect(0,0,w,h);g.strokeStyle='#e8b64a';g.lineWidth=10;g.strokeRect(8,8,w-16,h-16);g.lineWidth=3;g.strokeRect(22,22,w-44,h-44);
  g.fillStyle='#ffd877';g.textAlign='center';g.textBaseline='middle';g.font='900 '+(vertical?78:86)+'px "Noto Serif TC",serif';
  if(vertical){[...text].forEach((ch,i)=>g.fillText(ch,w/2,h/2+(i-(text.length-1)/2)*86));}else g.fillText(text,w/2,h/2+4);});}
const plaques=[];
const raysTex=canvasTex(256,256,(g)=>{g.translate(128,128);for(let i=0;i<36;i++){g.rotate(Math.PI*2/36);const w=2+rand()*5;
  const gr=g.createLinearGradient(0,0,128,0);gr.addColorStop(0,'rgba(255,230,160,.9)');gr.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gr;g.beginPath();g.moveTo(0,-w*.3);g.lineTo(128,-w);g.lineTo(128,w);g.lineTo(0,w*.3);g.fill();}
  const r=g.createRadialGradient(0,0,0,0,0,128);r.addColorStop(0,'rgba(255,240,190,.9)');r.addColorStop(.25,'rgba(255,210,140,.35)');r.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=r;g.fillRect(-128,-128,256,256);});
const lotusLampTex=canvasTex(64,64,(g)=>{const gr=g.createRadialGradient(32,36,0,32,36,30);gr.addColorStop(0,'rgba(255,200,120,.7)');gr.addColorStop(1,'rgba(255,150,80,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);
  g.fillStyle='#ffb3c8';for(let i=-2;i<=2;i++){g.save();g.translate(32,44);g.rotate(i*.42);g.beginPath();g.ellipse(0,-10,5,12,0,0,7);g.fill();g.restore();}
  g.fillStyle='#fff2c0';g.beginPath();g.arc(32,38,4,0,7);g.fill();});

// ---------- environment / sky ----------
const SUN=new V3(-0.55,0,-1).normalize();
const skyU={top:{value:C(0x3a5aa8)},mid:{value:C(0xf0b38a)},glow:{value:C(0xffd27a)},sun:{value:SUN}};
const skyFrag=`uniform vec3 top,mid,glow,sun;varying vec3 vD;
  void main(){vec3 d=normalize(vD);float h=d.y;
   vec3 col=mix(mid,top,smoothstep(-0.02,0.6,h));
   float s=max(dot(normalize(vec3(d.x,0.,d.z)+1e-5),sun),0.);
   float g=pow(s,3.)*(1.-smoothstep(-0.2,0.5,h));
   col=mix(col,glow,g);
   col+=glow*pow(max(dot(d,normalize(sun+vec3(0.,.06,0.))),0.),220.)*1.4;
   col=mix(col,mid*.75,smoothstep(0.0,-0.5,h));
   gl_FragColor=vec4(col,1.);}`;
const skyVert='varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,vertexShader:skyVert,fragmentShader:skyFrag});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1400,48,24),skyMat));
const envScene=new THREE.Scene();envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),skyMat));
const pmrem=new THREE.PMREMGenerator(renderer);
let envTex=pmrem.fromScene(envScene,0.02,0.1,200).texture;
const envMats=[];
function refreshEnv(){const old=envTex;envTex=pmrem.fromScene(envScene,0.02,0.1,200).texture;envMats.forEach(m=>{m.envMap=envTex;m.needsUpdate=true;});old.dispose();}

let starMat;
{const p=[],sz=[],ph=[];for(let i=0;i<1800;i++){const th=Math.random()*6.283,y=Math.random()*.95+.04,r=Math.sqrt(1-y*y);p.push(r*Math.cos(th)*1100,y*1100,r*Math.sin(th)*1100);sz.push(Math.random()<.05?3.2:1+Math.random()*1.5);ph.push(Math.random()*6.28);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('aSize',new THREE.Float32BufferAttribute(sz,1));g.setAttribute('aPhase',new THREE.Float32BufferAttribute(ph,1));
 starMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:{value:0},uOp:{value:0}},
  vertexShader:`attribute float aSize;attribute float aPhase;uniform float uTime;varying float vA;void main(){vA=0.55+0.45*sin(uTime*1.7+aPhase);gl_PointSize=aSize*${PR.toFixed(2)};gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float uOp;varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(1.,.95,.9,smoothstep(.5,0.,d)*vA*uOp);}`});
 const s=new THREE.Points(g,starMat);s.frustumCulled=false;scene.add(s);}

// ---------- lights ----------
const hemi=new THREE.HemisphereLight(0xffd9c0,0x4a3a60,0.65);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffc48a,1.25);sunL.position.set(-45,55,-80);sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048);Object.assign(sunL.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:10,far:260});sunL.shadow.bias=-0.0008;scene.add(sunL);
const fillL=new THREE.DirectionalLight(0x9fb4ff,0.45);fillL.position.set(40,30,90);scene.add(fillL);

// ---------- materials ----------
const M={
  yellowTile:new THREE.MeshStandardMaterial({map:tileTex('#e3a12e','#8a5410','#ffd56a'),roughness:.35,metalness:.2,side:THREE.DoubleSide}),
  greenTile:new THREE.MeshStandardMaterial({map:tileTex('#2f8a68','#123f30','#6fd0a8'),roughness:.35,metalness:.2,side:THREE.DoubleSide}),
  ridgeY:new THREE.MeshStandardMaterial({color:0xd9902a,roughness:.35,metalness:.3}),
  ridgeG:new THREE.MeshStandardMaterial({color:0x2a7a5c,roughness:.35,metalness:.3}),
  fascia:new THREE.MeshStandardMaterial({color:0x5a1a12,roughness:.6}),
  red:new THREE.MeshStandardMaterial({color:0xb0221a,roughness:.45}),
  gold:new THREE.MeshStandardMaterial({color:0xffc94a,metalness:.85,roughness:.22,emissive:0x4a2c00,emissiveIntensity:.6}),
  bronze:new THREE.MeshStandardMaterial({color:0x8a5a2a,metalness:.8,roughness:.35,emissive:0x1a0c00}),
  marble:new THREE.MeshStandardMaterial({color:0xf2ede4,roughness:.55}),
  stone:new THREE.MeshStandardMaterial({map:stoneTex,roughness:.85}),
  bracket:new THREE.MeshStandardMaterial({map:bracketTex,roughness:.5,emissive:0x0a1a20}),
  wall:new THREE.MeshStandardMaterial({map:wallTex,roughness:.6}),
  lattice:new THREE.MeshStandardMaterial({map:latticeTex,roughness:.5,emissive:0xffb060,emissiveIntensity:0}),
  dark:new THREE.MeshStandardMaterial({color:0x3a2620,roughness:.9}),
  lantern:new THREE.MeshStandardMaterial({color:0xff3a1a,emissive:0xff3010,emissiveIntensity:.6,roughness:.5}),
  lampWin:new THREE.MeshStandardMaterial({color:0xffe0a0,emissive:0xffb050,emissiveIntensity:.5}),
  pine:new THREE.MeshStandardMaterial({color:0x2f5a3c,flatShading:true,roughness:.9}),
  leaf:new THREE.MeshStandardMaterial({color:0x4f8f4a,flatShading:true,roughness:.9}),
  bark:new THREE.MeshStandardMaterial({color:0x5a4030,roughness:1}),
};
[M.gold,M.bronze].forEach(m=>{m.envMap=envTex;envMats.push(m);});

// ---------- helpers ----------
const SH=o=>{o.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});return o;};
const mesh=(geo,mat,x=0,y=0,z=0,parent)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(parent)parent.add(m);return m;};
const coneZ=(r,l,s=6)=>{const g=new THREE.ConeGeometry(r,l,s);g.translate(0,l/2,0);g.rotateX(Math.PI/2);return g;};
function tube(pts,r,mat,parent,closed=false,seg=48){const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,closed),seg,r,6,closed),mat);if(parent)parent.add(m);return m;}

// Hip roof (廡殿/歇山 feel): W>=D half sizes incl. overhang
function hipRoof(W,D,H,lift,tile,ridge,opt={}){
  const g=new THREE.Group();const L=Math.max(0,W-D);
  const Y=(x,z)=>{const dz=Math.abs(z)/D,dx=(Math.abs(x)-L)/D;const d=Math.min(1,Math.max(dz,dx,0));
    const c=sm(.45,1,Math.abs(x)/W)*sm(.45,1,Math.abs(z)/D);return H*Math.pow(1-d,1.6)+lift*c*c+lift*.22*Math.pow(d,4);};
  const geo=new THREE.PlaneGeometry(2*W,2*D,48,32);geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,Y(x,z));
    const dz=Math.abs(z)/D,dx=(Math.abs(x)-L)/D;if(dz>=dx)uv.setXY(i,x/1.4,z/1.4);else uv.setXY(i,z/1.4,x/1.4);}
  geo.computeVertexNormals();g.add(new THREE.Mesh(geo,tile));
  const e=[];const N=20;
  for(let k=0;k<N;k++)e.push(new V3(-W+2*W*k/N,0,D));for(let k=0;k<N;k++)e.push(new V3(W,0,D-2*D*k/N));
  for(let k=0;k<N;k++)e.push(new V3(W-2*W*k/N,0,-D));for(let k=0;k<N;k++)e.push(new V3(-W,0,-D+2*D*k/N));
  e.forEach(v=>v.y=Y(v.x,v.z)-.05);tube(e,.14,M.fascia,g,true,200);
  if(L>.05){const rp=[new V3(-L-1.3,H+1.1,0),new V3(-L-.5,H+.38,0),new V3(-L*.5,H+.28,0),new V3(0,H+.28,0),new V3(L*.5,H+.28,0),new V3(L+.5,H+.38,0),new V3(L+1.3,H+1.1,0)];
    tube(rp,.3,ridge,g,false,64);
    for(const sx of[1,-1])for(const sz of[1,-1]){const f=mesh(coneZ(.17,1.2,6),ridge,sx*(L+1.25),H+1.05,sz*.12,g);f.lookAt(sx*(L+2.4),H+2.0,sz*.9);}
    const orb=mesh(new THREE.SphereGeometry(.5,16,12),M.gold,0,H+.95,0,g);mesh(coneZ(.18,.9,8),M.gold,0,H+1.3,0,g).rotation.x=-Math.PI/2;
  }else{const fin=new THREE.Group();fin.position.y=H;g.add(fin);mesh(new THREE.SphereGeometry(.38,12,10),M.gold,0,.3,0,fin);mesh(new THREE.SphereGeometry(.25,12,10),M.gold,0,.8,0,fin);mesh(new THREE.ConeGeometry(.12,.7,8),M.gold,0,1.3,0,fin);}
  for(const sx of[1,-1])for(const sz of[1,-1]){const hp=[];for(let k=0;k<=8;k++){const f=k/8;const x=sx*(L+f*(W-L)),z=sz*f*D;hp.push(new V3(x,Y(x,z)+.14,z));}
    const end=hp[8];hp.push(new V3(end.x+sx*.55,end.y+.75,end.z+sz*.55));tube(hp,.16,ridge,g,false,40);
    mesh(new THREE.SphereGeometry(.2,8,6),M.gold,end.x+sx*.6,end.y+.85,end.z+sz*.6,g);
    if(opt.bells){const b=mesh(new THREE.ConeGeometry(.16,.4,8,1,true),M.bronze,end.x,end.y-.45,end.z,g);}}
  return SH(g);
}
// octagonal pagoda roof
function octRoof(rIn,rOut,h,lift,tile,ridge){
  const g=new THREE.Group();const seg=64,rs=8,pos=[],uv=[],idx=[];const P8=Math.PI/8;

    const corner=Math.pow(Math.abs(m-P8)/P8,5);const r=(rIn+t*(rOut-rIn))*k;const y=h*Math.pow(1-t,1.45)+lift*corner*t*t*t;
    pos.push(Math.cos(th)*r,y,Math.sin(th)*r);uv.push(j/seg*16,t*2);}}
  for(let i=0;i<rs;i++)for(let j=0;j<seg;j++){const a=i*(seg+1)+j,b=a+seg+1;idx.push(a,a+1,b,a+1,b+1,b);}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(idx);geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo,tile));
  const e=[];for(let j=0;j<seg;j++){const k=(rs*(seg+1)+j)*3;e.push(new V3(pos[k],pos[k+1]-.04,pos[k+2]));}tube(e,.1,M.fascia,g,true,160);
  for(let c=0;c<8;c++){const th=c*Math.PI/4;const hp=[];for(let i=0;i<=rs;i++){const k=(i*(seg+1)+c*8)*3;hp.push(new V3(pos[k],pos[k+1]+.1,pos[k+2]));}
    const end=hp[rs];hp.push(new V3(end.x+Math.cos(th)*.4,end.y+.5,end.z+Math.sin(th)*.4));tube(hp,.1,ridge,g,false,24);
    mesh(new THREE.ConeGeometry(.12,.35,8,1,true),M.bronze,end.x,end.y-.35,end.z,g);}
  return SH(g);
}

for(let i=0;i<10;i++){const a=R(0,6.283),d=R(90,170);const m=new THREE.SpriteMaterial({map:cloudTex,color:0xffffff,transparent:true,opacity:R(.25,.45),depthWrite:false});cloudMats.push(m);
  const s=new THREE.Sprite(m);const sc=R(30,50);s.scale.set(sc*2,sc*.6,1);s.position.set(Math.cos(a)*d,R(15,45),Math.sin(a)*d);clouds.add(s);}
const mtnMat=new THREE.MeshStandardMaterial({color:0x6a6a9a,flatShading:true,roughness:1});
for(let i=0;i<16;i++){const a=i/16*6.283+R(-.15,.15),d=R(220,420),h=R(50,120);const m=mesh(new THREE.ConeGeometry(R(30,60),h,7,3),mtnMat,Math.cos(a)*d,-40+h/2,Math.sin(a)*d,scene);m.rotation.y=rand()*3;
  const p=m.geometry.attributes.position;for(let k=0;k<p.count;k++)if(p.getY(k)<h/2-1)p.setX(k,p.getX(k)*(1+R(-.15,.15)));m.geometry.computeVertexNormals();}

// ---------- gold motes ----------
let motes;const MT=[];
{const N=260,pos=new Float32Array(N*3);for(let i=0;i<N;i++)MT.push({a:R(0,6.283),r:R(4,26),y:R(G,30),v:R(.3,.8),ph:R(0,6)});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 motes=new THREE.Points(g,new THREE.PointsMaterial({map:dotTex,color:0xffd88a,size:.5,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));motes.frustumCulled=false;world.add(motes);}

// ---------- lotus lamps ----------
const lamps=[];const lampMat=new THREE.SpriteMaterial({map:lotusLampTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function spawnLamp(){const s=new THREE.Sprite(lampMat);const sd=rand()<.5?1:-1;s.position.set(sd*7.4+R(-3.5,3.5),G+.5,22+R(-2.5,2.5));s.scale.setScalar(R(1,1.5));
  s.userData={v:R(1.2,2.2),ph:R(0,6),x:s.position.x,z:s.position.z,age:0};world.add(s);lamps.push(s);}
for(let i=0;i<10;i++){spawnLamp();lamps[i].position.y=R(2,60);}

// ---------- bell: sound + ripple ----------
let actx=null,bellSwing=0;const ripples=[];
function ringBell(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();
    const now=actx.currentTime,out=actx.createGain();out.gain.value=.5;out.connect(actx.destination);
    const f0=98;[[.5,.5,14],[1,1,11],[1.19,.55,9],[1.56,.45,7],[2,.4,6],[2.51,.25,4.5],[2.74,.22,4],[3.24,.15,3],[4.07,.1,2.2]].forEach(([r,a,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f0*r*(1+(Math.random()-.5)*.004);
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(a*.35,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+d);
      const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.8+r*.3;lg.gain.value=a*.06;lfo.connect(lg);lg.connect(g.gain);
      o.connect(g);g.connect(out);o.start(now);o.stop(now+d);lfo.start(now);lfo.stop(now+d);});
    const nb=actx.createBuffer(1,actx.sampleRate*.08,actx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,3);
    const ns=actx.createBufferSource(),nf=actx.createBiquadFilter(),ng=actx.createGain();nf.type='lowpass';nf.frequency.value=900;ng.gain.value=.5;ns.buffer=nb;ns.connect(nf);nf.connect(ng);ng.connect(out);ns.start(now);
  }catch(e){}
  bellSwing=1;
  const p=new V3();bell.getWorldPosition(p);world.worldToLocal(p);
  for(let k=0;k<3;k++){const m=new THREE.Mesh(new THREE.TorusGeometry(1,.06,6,96),new THREE.MeshBasicMaterial({color:0xffe0a0,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.rotation.x=Math.PI/2;m.position.copy(p);world.add(m);ripples.push({m,age:-k*.35});}
  for(let i=0;i<8;i++)spawnLamp();
}

// ---------- day / night ----------
let night=0,nightT=0;
const DAWN={top:C(0x3a5aa8),mid:C(0xf0b38a),glow:C(0xffd27a),fog:C(0xd9a99a),cloud:C(0xffe6e0),mtn:C(0x7a6a9a),hemiS:C(0xffd9c0),hemiG:C(0x4a3a60),sun:C(0xffc48a)};
const NIGHT={top:C(0x060a24),mid:C(0x1e1a4a),glow:C(0x5a3a7a),fog:C(0x1a1838),cloud:C(0x5a5a8a),mtn:C(0x1e1e3e),hemiS:C(0x6a70b0),hemiG:C(0x15122a),sun:C(0x8aa0ff)};
const tc=C();let lastEnvN=-1;
function applyMode(n){
  const L=(k)=>tc.copy(DAWN[k]).lerp(NIGHT[k],n);
  skyU.top.value.copy(L('top'));skyU.mid.value.copy(L('mid'));skyU.glow.value.copy(L('glow'));
  scene.fog.color.copy(L('fog'));cloudMats.forEach(m=>m.color.copy(L('cloud')));mtnMat.color.copy(L('mtn'));
  hemi.color.copy(L('hemiS'));hemi.groundColor.copy(L('hemiG'));hemi.intensity=.65-.25*n;
  sunL.color.copy(L('sun'));sunL.intensity=1.25-.85*n;fillL.intensity=.45-.2*n;
  starMat.uniforms.uOp.value=n;
  M.lantern.emissiveIntensity=.6+1.6*n;M.lampWin.emissiveIntensity=.5+1.5*n;M.lattice.emissiveIntensity=.35*n;
  lotusFlowers.forEach(m=>m.emissiveIntensity=.15+.6*n);plaques.forEach(()=>{});
  hallLight.intensity=2.2*n;
  rays.material.opacity=.5-.15*n;
  if(Math.abs(n-lastEnvN)>.2||(n===0||n===1)&&n!==lastEnvN){refreshEnv();lastEnvN=n;}
}

// fonts → redraw plaques
if(document.fonts&&document.fonts.load){document.fonts.load('900 80px "Noto Serif TC"','大雄寶殿雲上禪寺鐘樓鼓樓').then(()=>{plaques.forEach(t=>{const u=t.userData;u.draw(u.c.getContext('2d'),u.c.width,u.c.height,u.c);t.needsUpdate=true;});}).catch(()=>{});}

// ---------- camera control ----------
const target=new V3(0,8,-4),targetFar=new V3(0,8,-4);
const portrait=innerHeight>innerWidth;
let theta=0.35,phi=1.18,radius=portrait?120:92;let tTheta=theta,tPhi=phi,tRad=radius;
let auto=true,lastInput=-10;
const ptrs=new Map();let pinch0=0,rad0=0;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);rad0=tRad;}lastInput=clock.elapsedTime;});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){tTheta-=(e.clientX-p.x)*0.006;tPhi=Math.max(.35,Math.min(1.62,tPhi-(e.clientY-p.y)*0.005));}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)tRad=Math.max(25,Math.min(260,rad0*pinch0/d));}
  lastInput=clock.elapsedTime;});
const up=e=>{ptrs.delete(e.pointerId);pinch0=0;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();tRad=Math.max(25,Math.min(260,tRad*(1+e.deltaY*0.001)));lastInput=clock.elapsedTime;},{passive:false});
cv.addEventListener('dblclick',()=>ringBell());
let lastTap=0;cv.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')return;const n=performance.now();if(n-lastTap<300)ringBell();lastTap=n;});

const bAuto=document.getElementById('bAuto');bAuto.onclick=()=>{auto=!auto;bAuto.classList.toggle('on',auto);};
document.getElementById('bBell').onclick=ringBell;
document.getElementById('bLamp').onclick=()=>{for(let i=0;i<12;i++)spawnLamp();};
const bMode=document.getElementById('bMode');bMode.onclick=()=>{nightT=nightT?0:1;bMode.textContent=nightT?'🌅 晨曦':'🌙 夜晚';updateSub();};
let deity='buddha';
const SUBS={wealth:'財神爺 · 招財進寶',love:'月下老人 · 千里姻緣一線牽',fame:'文昌帝君 · 金榜題名'};
const OFFER={wealth:['🪙 供元寶',offerWealth],love:['🌸 供百合',offerLove],fame:['🖌️ 供文房四寶',offerFame]};
function updateSub(){document.getElementById('sub').textContent=deity==='buddha'?(nightT?'地藏王菩薩 · 大願地藏':'大日如來 · 光明遍照'):SUBS[deity];}
const bOffer=document.getElementById('bOffer');
document.querySelectorAll('#wish [data-d]').forEach(b=>b.onclick=()=>{deity=b.dataset.d;document.querySelectorAll('#wish [data-d]').forEach(x=>x.classList.toggle('on',x===b));
  if(deity==='buddha'){bOffer.style.display='none';}else{bOffer.style.display='';bOffer.textContent=OFFER[deity][0];}updateSub();});
bOffer.onclick=()=>{if(OFFER[deity])OFFER[deity][1]();};
const bFin=document.getElementById('bFin');bFin.onclick=()=>{woodFinish=!woodFinish;applyFinish();bFin.textContent=woodFinish?'✨ 金身':'🪵 木雕';};
let closeUp=false;const bAltar=document.getElementById('bAltar');bAltar.onclick=()=>{closeUp=!closeUp;bAltar.classList.toggle('on',closeUp);
  if(closeUp){tRad=portrait?17:11.5;tPhi=1.22;tTheta=Math.round(tTheta/6.2832)*6.2832;auto=false;bAuto.classList.remove('on');}else{tRad=portrait?120:92;tPhi=1.18;}};
const ui=document.getElementById('ui');document.getElementById('eye').onclick=()=>ui.classList.toggle('hide');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ---------- loop ----------
const clock=new THREE.Clock();const tmpV=new V3();const SW={vairo:1,ksiti:0,wealth:0,love:0,fame:0};
applyMode(0);setStatueMode(0,0);
function tick(){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  starMat.uniforms.uTime.value=t;
  if(Math.abs(night-nightT)>.001){night+=(nightT-night)*Math.min(1,dt*1.5);if(Math.abs(night-nightT)<.01)night=nightT;applyMode(night);setStatueMode(night,t);}
  if(auto&&t-lastInput>3)tTheta+=dt*0.06;
  const tgtGoal=closeUp?tmpV.set(ALTAR.x,ALTAR.y+2.6+world.position.y,ALTAR.z):targetFar;target.lerp(tgtGoal,.06);
  hallGroup.visible=!(closeUp&&radius<45);
  theta+=(tTheta-theta)*.08;phi+=(tPhi-phi)*.08;radius+=(tRad-radius)*.08;
  camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
  world.position.y=Math.sin(t*.4)*.5;
  clouds.rotation.y+=dt*.004;
  rays.material.rotation+=dt*.05;halo.rotation.z+=dt*.2;
  mandorla.material.opacity=.3+.08*Math.sin(t*1.3);
  lanterns.forEach(l=>{l.g.rotation.z=Math.sin(t*1.2+l.ph)*.04;l.s2.material.opacity=(.25+.45*night)*(.9+.1*Math.sin(t*5+l.ph));});
  stoneLamps.forEach((s,i)=>s.material.opacity=(.2+.5*night)*(.9+.1*Math.sin(t*6+i)));
  // smoke
  smoke.forEach(p=>{p.age+=dt;if(p.age>p.life){p.age=0;p.x=R(-.4,.4);p.z=R(-.4,.4);}const f=p.age/p.life;
    p.s.position.set(BURN.x+p.x+Math.sin(t*.6+p.x*9)*f*1.6+f*2,BURN.y+3.7+f*11,BURN.z+p.z+Math.cos(t*.5+p.z*7)*f*1.2);
    p.s.scale.setScalar(.8+f*4.5);p.s.material.opacity=Math.sin(Math.PI*Math.min(1,f*1.3))*.45*(1-.4*night);p.s.material.rotation=f*2+p.x;});
  // statue swap
  {const ST={vairo,ksiti,wealth:deityG.wealth,love:deityG.love,fame:deityG.fame};const ak=deity==='buddha'?(nightT?'ksiti':'vairo'):deity;
   let othersOut=true;for(const k in ST)if(k!==ak&&SW[k]>.03)othersOut=false;let tr=0;
   for(const k in ST){if(k===ak){if(othersOut)SW[k]=Math.min(1,SW[k]+dt*1.8);}else SW[k]=Math.max(0,SW[k]-dt*2.4);
     const e=SW[k]*SW[k]*(3-2*SW[k]);ST[k].scale.setScalar(BS*Math.max(.001,e));ST[k].visible=SW[k]>.005;tr=Math.max(tr,SW[k]*(1-SW[k])*4);}
   if(SW[ak]<.05)tr=Math.max(tr,.8);flare.material.opacity=tr*.9;
   const bw=SW.vairo+SW.ksiti;halo.scale.setScalar(Math.max(.001,bw));ring2.scale.setScalar(Math.max(.001,bw));haloDisc.scale.setScalar(6*bw+.001);mandorla.scale.set(11*bw+.001,16*bw+.001,1);}
  updFx(dt,t);
  // altar incense & flames
  incenseTips.forEach(tp=>{tp.gl.material.opacity=.7+.3*Math.sin(t*7+tp.ph);});
  altarFlames.forEach((f,i)=>{f.scale.set(.35+.05*Math.sin(t*11+i),.6+.1*Math.sin(t*9+i*2),1);});
  incSmoke.forEach(p=>{p.age+=dt;if(p.age>p.life)p.age-=p.life;const f=p.age/p.life;
    p.s.position.set(p.tp.p.x+Math.sin(t*1.1+f*5+p.tp.ph)*f*.5,p.tp.p.y+.05+f*4.2,p.tp.p.z+Math.cos(t*.9+f*4)*f*.35);
    p.s.scale.setScalar(.12+f*1.3);p.s.material.opacity=Math.min(1,f*6)*(1-f)*.5;p.s.material.rotation=f*3;});
  rays.material.rotation+=0;
  // motes
  {const p=motes.geometry.attributes.position.array;MT.forEach((m,i)=>{m.y+=m.v*dt;if(m.y>32)m.y=G;m.a+=dt*.05;
    p[i*3]=Math.cos(m.a)*m.r+Math.sin(t+m.ph)*.5;p[i*3+1]=m.y;p[i*3+2]=BZ*.4+Math.sin(m.a)*m.r;});motes.geometry.attributes.position.needsUpdate=true;
    motes.material.opacity=.55+.35*night;}
  // lamps
  for(let i=lamps.length-1;i>=0;i--){const s=lamps[i],u=s.userData;s.position.y+=u.v*dt;s.position.x=u.x+Math.sin(t*.5+u.ph)*1.5+(s.position.y-G)*.12;s.position.z=u.z+Math.cos(t*.4+u.ph)*1.5;
    if(s.position.y>110){if(lamps.length>14){world.remove(s);lamps.splice(i,1);}else{s.position.y=G+.5;}}}
  // bell
  if(bellSwing>0){bellSwing=Math.max(0,bellSwing-dt*.35);bellG.rotation.x=Math.sin(t*5)*.18*bellSwing;}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.age+=dt;if(r.age<0){r.m.visible=false;continue;}r.m.visible=true;const s=1+r.age*22;r.m.scale.setScalar(s);r.m.material.opacity=Math.max(0,.9-r.age*.45);
    if(r.age>2){world.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();ripples.splice(i,1);}}
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
})();
